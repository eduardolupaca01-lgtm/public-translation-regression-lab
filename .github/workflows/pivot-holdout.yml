name: Public Japanese-English-Spanish pivot holdout

on:
  push:
    paths:
      - ".github/workflows/pivot-holdout.yml"
      - "tools/pivot_holdout.py"
      - "tools/unseen_holdout.py"
      - "tests/test_pivot_holdout.py"
      - "tests/test_unseen_holdout.py"
      - "translation_lab/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ja-en-es-pivot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pivot-holdout:
    name: Raw ja-en-en-es pivot and cold SQLite replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: /tmp/public-ja-en-es-pivot-model-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "90"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PIVOT_WORKSPACE: /tmp/public-ja-en-es-pivot-holdout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject private assets and credentials
        run: python tools/publication_guard.py
      - name: Run complete offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Install pinned public Marian inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            transformers==4.57.1 sentencepiece==0.2.1 sacremoses==0.1.1
      - name: Evaluate the fixed ten cases through Japanese-English-Spanish
        run: python -m tools.pivot_holdout translate --workspace "$PIVOT_WORKSPACE"
      - name: Verify SQLite replay in a fresh process without model weights
        if: always()
        run: python -m tools.pivot_holdout verify --workspace "$PIVOT_WORKSPACE"
      - name: Preserve pivot translations and restart proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ja-en-es-pivot-holdout-receipts
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/public-ja-en-es-pivot-holdout/pivot-report.json
            /tmp/public-ja-en-es-pivot-holdout/pivot-restart-proof.json
