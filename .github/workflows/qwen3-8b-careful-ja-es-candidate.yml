name: Qwen3-8B careful-prompt Japanese to Spanish candidate evaluation

on:
  push:
    paths:
      - ".github/workflows/qwen3-8b-careful-ja-es-candidate.yml"
      - "tools/qwen3_8b_careful_ja_es_candidate.py"
      - "tests/test_qwen3_8b_careful_ja_es_candidate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen3-8b-careful-ja-es-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Qwen3-8B uniform careful-prompt candidate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HOME: /tmp/qwen8b-careful-hf-home
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      QWEN8B_WORKSPACE: /tmp/qwen8b-careful-ja-es-quality
      QWEN8B_STAGE3_WORKSPACE: /tmp/qwen8b-careful-stage3-quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject private assets and credentials
        run: python tools/publication_guard.py
      - name: Compile sources
        run: python -m compileall -q translation_lab tests tools
      - name: Run full offline regression and careful-prompt contract tests
        run: python -m unittest discover -s tests -v
      - name: Download pinned llama.cpp CPU server
        run: |
          mkdir -p "$RUNNER_TEMP/llama"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12584/llama-b12584-bin-ubuntu-x64.tar.gz" \
            --output "$RUNNER_TEMP/llama-b12584.tar.gz"
          tar -xzf "$RUNNER_TEMP/llama-b12584.tar.gz" -C "$RUNNER_TEMP/llama"
          LLAMA_SERVER="$(find "$RUNNER_TEMP/llama" -type f -name llama-server -print -quit)"
          if [ -z "$LLAMA_SERVER" ]; then echo "Pinned llama-server missing"; exit 1; fi
          chmod +x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$LLAMA_SERVER"):$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          "$LLAMA_SERVER" --version
      - name: Install pinned Hugging Face download client
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            huggingface_hub==0.36.0
      - name: Run source-only uniform careful-prompt Qwen3-8B inference
        run: |
          python -m tools.qwen3_8b_careful_ja_es_candidate translate \
            --llama-server "$LLAMA_SERVER" \
            --workspace "$QWEN8B_WORKSPACE"
      - name: Verify SQLite cache in a fresh process without model weights
        if: always()
        run: |
          python -m tools.qwen3_8b_careful_ja_es_candidate verify \
            --workspace "$QWEN8B_WORKSPACE"
      - name: Translate disjoint ten-dialogue holdout only after 20/20 and cold restart
        id: stage3_translate
        if: success()
        run: |
          python -m tools.qwen3_stage3_holdout translate \
            --candidate-report "$QWEN8B_WORKSPACE/qwen8b-candidate-report.json" \
            --candidate-restart-proof "$QWEN8B_WORKSPACE/qwen8b-restart-proof.json" \
            --llama-server "$LLAMA_SERVER" \
            --workspace "$QWEN8B_STAGE3_WORKSPACE"
      - name: Audit holdout SQLite and review queue in a fresh process
        if: always() && steps.stage3_translate.outcome != 'skipped'
        run: |
          python -m tools.qwen3_stage3_holdout verify \
            --workspace "$QWEN8B_STAGE3_WORKSPACE"
      - name: Preserve raw outputs, translations, and restart proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-8b-careful-ja-es-candidate-receipts
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/qwen8b-careful-ja-es-quality/qwen8b-candidate-report.json
            /tmp/qwen8b-careful-ja-es-quality/qwen8b-restart-proof.json
            /tmp/qwen8b-careful-ja-es-quality/review-queue.json
            /tmp/qwen8b-careful-ja-es-quality/llama-server.log
            /tmp/qwen8b-careful-ja-es-quality/cache/translation-cache.sqlite3
            /tmp/qwen8b-careful-stage3-quality/stage3-source-manifest.json
            /tmp/qwen8b-careful-stage3-quality/stage3-report.json
            /tmp/qwen8b-careful-stage3-quality/stage3-restart-proof.json
            /tmp/qwen8b-careful-stage3-quality/stage3-review-queue.json
            /tmp/qwen8b-careful-stage3-quality/llama-server.log
            /tmp/qwen8b-careful-stage3-quality/cache/translation-cache.sqlite3
