name: Tenshixgame RPG original TX768 Windows V95 build (encrypted test only)

on:
  push:
    branches:
      - build/eduardo-original-rpg-win64-20261121
    paths:
      - "tools/replay_eduardo_original.py"
      - ".github/workflows/eduardo-original-rpg-win64.yml"
      - "docs/EDUARDO_ORIGINAL_RPG_BUILD_HANDOFF.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eduardo-original-rpg-public-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-free-preflight:
    name: Validate original build replay contract (no private access)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check reproducible source-free bridge code
        shell: bash
        run: |
          python -m py_compile tools/replay_eduardo_original.py
          python tools/replay_eduardo_original.py --self-test
          python tools/publication_guard.py
          echo "EDUARDO_ORIGINAL_PUBLIC_ORCHESTRATION_ONLY_PASS"

  rebuild-genuine-original-windows:
    name: Eduardo ORIGINAL RPG EXE - 26 gates, encrypted owner-only output
    needs: source-free-preflight
    runs-on: windows-2022
    timeout-minutes: 180
    # The owner stated they saved the two secret VALUES under opposite names.
    # Map by actual contents here; no values, tokens, or passwords in git.
    env:
      EDUARDO_RPG_SOURCE_TOKEN: ${{ secrets.EDUARDO_RPG_ARCHIVE_PASSWORD }}
      EDUARDO_RPG_ARCHIVE_PASSWORD: ${{ secrets.EDUARDO_RPG_SOURCE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify secret values according to owner's reversed field placement (no disclosure)
        shell: pwsh
        run: |
          if (-not $env:EDUARDO_RPG_SOURCE_TOKEN -or $env:EDUARDO_RPG_SOURCE_TOKEN.Length -lt 20 -or -not $env:EDUARDO_RPG_SOURCE_TOKEN.StartsWith('github_pat_')) {
            Write-Host "HOLD: Set the public repo's EDUARDO_RPG_SOURCE_TOKEN Actions secret to a fine-grained read-only token for Eduardo's private source and releases."
            throw "EDUARDO_PRIVATE_SOURCE_READ_ACCESS_REQUIRED"
          }
          if (-not $env:EDUARDO_RPG_ARCHIVE_PASSWORD -or $env:EDUARDO_RPG_ARCHIVE_PASSWORD.Length -lt 20 -or $env:EDUARDO_RPG_ARCHIVE_PASSWORD.StartsWith('github_pat_')) {
            Write-Host "HOLD: Set EDUARDO_RPG_ARCHIVE_PASSWORD (20+ characters) to encrypt the private original EXE before public artifact upload."
            throw "EDUARDO_OWNER_ONLY_ENCRYPTION_REQUIRED"
          }
          Write-Host "EDUARDO_BUILD_CREDENTIALS_PRESENT_AND_NOT_LOGGED"

      - name: Fetch actual private original source from Eduardo at fixed TX765 commit
        uses: actions/checkout@v4
        with:
          repository: eduardolupaca01-lgtm/tenshixgame-rpg-tx723-build
          ref: 579cb1570efb2889057f7f9f5e03fb3bb7156268
          path: original
          token: ${{ secrets.EDUARDO_RPG_ARCHIVE_PASSWORD }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Diagnose private V95 gate-06 contracts without leaking their test output
        shell: pwsh
        run: |
          python ci/tools/diag_eduardo_v95_contracts.py --source-root original --runner-temp "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw "EDUARDO_PRIVATE_V95_GATE06_SOURCE_CONTRACT_FAILED" }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: TX768 run speaker-consumed first-paint regression before model rebuild
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "tx768-visual-regression.log"
          node original/tests/js/test_tx765_no_overdraw_sync_custom_start.js *> $log
          if ($LASTEXITCODE -ne 0) { throw "TX768_NATIVE_NAMEBOX_REGRESSION_HOLD" }
          Write-Host "TX768_NATIVE_NAMEBOX_REGRESSION_PASS"

      - name: Install build-orchestrator YAML parser
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.2"
          if ($LASTEXITCODE -ne 0) { throw "BUILD_REPLAY_YAML_PARSER_MISSING" }

      - name: Run the EXACT original source-pinned GUI and V95 chain on Windows
        shell: pwsh
        run: |
          python ci/tools/replay_eduardo_original.py --source-root original --receipt "$env:RUNNER_TEMP/eduardo-original-rebuild-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw "EDUARDO_ORIGINAL_V95_BUILD_OR_TEST_HOLD" }
          $receipt = Get-Content "$env:RUNNER_TEMP/eduardo-original-rebuild-receipt.json" -Raw | ConvertFrom-Json
          if ($receipt.status -ne "ORIGINAL_EXE_BUILT_AND_REAL_NEURAL_TESTS_PASS" -or -not $receipt.tx765_private_repair_source_verified -or $receipt.steps_passed -ne 26 -or $receipt.source_commit -ne "579cb1570efb2889057f7f9f5e03fb3bb7156268") {
            throw "EDUARDO_ORIGINAL_EXE_RECEIPT_INVALID"
          }

      - name: Encrypt private original EXE so public Actions never exposes the underlying binary
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "Tenshixgame-RPG.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "ORIGINAL_EXE_NOT_FOUND"
          }
          $seven = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($null -eq $seven -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            $sevenExe = "C:\Program Files\7-Zip\7z.exe"
          } elseif ($null -ne $seven) {
            $sevenExe = $seven.Source
          } else {
            throw "7ZIP_AES256_REQUIRED_FOR_PROTECTED_ARTIFACT"
          }
          $directory = Join-Path $env:RUNNER_TEMP "eduardo-encrypted-output"
          New-Item -ItemType Directory -Force $directory | Out-Null
          $ciphertext = Join-Path $directory "Tenshixgame-RPG-TX768-V95-PRUEBA.7z"
          $passArgument = "-p" + $env:EDUARDO_RPG_ARCHIVE_PASSWORD
          & $sevenExe a -t7z -mhe=on -mx=0 $passArgument $ciphertext $exe | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $ciphertext)) {
            throw "EDUARDO_PRIVATE_EXE_ENCRYPTION_FAILED"
          }
          & $sevenExe t $passArgument $ciphertext | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "EDUARDO_ENCRYPTED_ARCHIVE_INTEGRITY_FAILED" }
          $receipt = Join-Path $env:RUNNER_TEMP "eduardo-original-rebuild-receipt.json"
          Copy-Item -LiteralPath $receipt -Destination (Join-Path $directory "eduardo-original-build-receipt.json")
          $hash = (Get-FileHash -LiteralPath $ciphertext -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash + "  Tenshixgame-RPG-TX768-V95-PRUEBA.7z") | Set-Content -LiteralPath (Join-Path $directory "SHA256.txt") -Encoding ascii
          Write-Host "EDUARDO_ORIGINAL_ENCRYPTED_ARCHIVE_SHA256=$hash"
          Write-Host "EDUARDO_ORIGINAL_REAL_V95_ONEFILE_ENCRYPTED_OWNER_ONLY_NO_PUBLIC_PLAINTEXT"
          "Verified original V95 EXE. Encrypted with owner-held EDUARDO_RPG_ARCHIVE_PASSWORD. Extract with 7-Zip and test only on a copy of your game. This does not certify the user's own game or authorize public distribution." |
            Set-Content -LiteralPath (Join-Path $directory "LEER-ORIGINAL.txt") -Encoding utf8

      - name: Upload ONLY encrypted original EXE and nonsensitive provenance
        uses: actions/upload-artifact@v4
        with:
          name: Eduardo-Tenshixgame-RPG-ORIGINAL-TX768-V95-Windows-TEST-ENCRYPTED
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/eduardo-encrypted-output/

      - name: Keep only nonsensitive HOLD receipt on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Eduardo-Original-RPG-Windows-HOLD
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/eduardo-original-rebuild-receipt.json
