name: MADLAD direct Japanese to Spanish candidate comparison

on:
  push:
    paths:
      - ".github/workflows/madlad-ja-es-candidate.yml"
      - "tools/madlad_ja_es_candidate.py"
      - "tests/test_madlad_ja_es_candidate.py"
      - "tools/independent_pivot_holdout.py"
      - "translation_lab/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madlad-ja-es-candidate-${ github.ref }
  cancel-in-progress: true

jobs:
  compare:
    name: MADLAD direct ja-es (${ matrix.candidate })
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate: [base, es419]
    env:
      HF_HOME: /tmp/madlad-hf-home
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MADLAD_WORKSPACE: /tmp/madlad-${ matrix.candidate }-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reject private assets and credentials
        run: python tools/publication_guard.py

      - name: Compile Python sources
        run: python -m compileall -q translation_lab tests tools

      - name: Run full offline regression and candidate contract tests
        run: python -m unittest discover -s tests -v

      - name: Install pinned CPU inference runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            ctranslate2==4.8.2 \
            transformers==4.57.6 \
            sentencepiece==0.2.1 \
            huggingface_hub==0.36.0

      - name: Run real MADLAD inference on the fixed 20-case development benchmark
        run: |
          python -m tools.madlad_ja_es_candidate translate \
            --candidate "${ matrix.candidate }" \
            --workspace "$MADLAD_WORKSPACE"

      - name: Verify accepted SQLite rows in a fresh process without model weights
        if: always()
        run: |
          python -m tools.madlad_ja_es_candidate verify \
            --candidate "${ matrix.candidate }" \
            --workspace "$MADLAD_WORKSPACE"

      - name: Preserve raw outputs, translations, and cold-restart proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madlad-ja-es-${ matrix.candidate }-candidate-receipts
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/madlad-${ matrix.candidate }-quality/madlad-candidate-report.json
            /tmp/madlad-${ matrix.candidate }-quality/madlad-restart-proof.json
            /tmp/madlad-${ matrix.candidate }-quality/review-queue.json
            /tmp/madlad-${ matrix.candidate }-quality/cache/translation-cache.sqlite3
