          if ($LASTEXITCODE -ne 0) { throw "IA_R44_CIFRADO_NO_VERIFICA" }
          $sha=(Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Servidor-R45-RenPy-Fix2.7z" | Set-Content (Join-Path $dir "SHA256.txt") -Encoding ascii
