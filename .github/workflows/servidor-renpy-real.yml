          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "Servidor.exe") -Destination $stage
          'Servidor R45 - candidato experimental RENPY + RPG + WEB. Instala RenPy solo en una copia cerrada y abre el EXE original normalmente. Consulta Estado IA Traductora. OPUS local ingles/japones a espanol. Restaurar RenPy retira el complemento y conserva memoria y partidas. Compatibilidad universal no certificada; consultar resultados por version. No distribuir como estable.' | Set-Content (Join-Path $stage "LEEME.txt") -Encoding ascii
          $package=Join-Path $dir "Servidor-R45-RenPy-Fix2.7z"
          & $seven a -t7z -mhe=on -mx=0 "-p$env:IA_PASSWORD" $package (Join-Path $stage "Servidor.exe") (Join-Path $stage "LEEME.txt") | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "IA_R44_CIFRADO_FALLO" }
