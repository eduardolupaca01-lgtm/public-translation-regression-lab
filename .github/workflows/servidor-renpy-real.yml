      - name: Cifrar candidato R45 RenPy de prueba
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IA_PASSWORD)) { throw "IA_CIFRADO_CLAVE_FALTANTE" }
          $seven="C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path -LiteralPath $seven)) { $seven=(Get-Command 7z.exe -ErrorAction Stop).Source }
          $dir=Join-Path $env:RUNNER_TEMP "IA-R45-RenPy-Cifrado"
