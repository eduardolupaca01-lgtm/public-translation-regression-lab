name: Servidor R45 - RenPy and existing engines real OPUS candidate
on:
  push:
    branches: [feature/servidor-renpy-r1]
    paths:
      - 'servidor_v2/**'
      - '.github/workflows/servidor-renpy-real.yml'
      - '.github/workflows/servidor-renpy-r1.yml'
      - '.github/workflows/servidor-renpy-classic-sdk.yml'
      - '.github/scripts/renpy_classic_sdk_probe.py'
  workflow_dispatch:

concurrency:
  group: servidor-renpy-real-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  classic-required:
    name: Required classic SDK tests (4, 5, early 6)
    uses: ./.github/workflows/servidor-renpy-classic-sdk.yml
    permissions:
      contents: read
  modern-required:
    name: Required installer and modern SDK regressions
    uses: ./.github/workflows/servidor-renpy-r1.yml
    permissions:
      contents: read
  build-real-ia:
    needs: [classic-required, modern-required]
    if: ${{ success() && needs.classic-required.result == 'success' && needs.modern-required.result == 'success' }}
    name: Reconstruir motor propio desde modelos verificados y probar español real
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      IA_PASSWORD: ${{ secrets.EDUARDO_RPG_SOURCE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.2"
          cache-dependency-path: servidor_v2/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Exigir regresiones VX Ace y compilar helper antes de cargar pesos
        shell: pwsh
        run: |
          ruby -c servidor_v2/vxace/IATraductoraVXACE.rb
          if ($LASTEXITCODE -ne 0) { throw "IA_VXACE_RUBY_SYNTAX_FAIL" }
          ruby servidor_v2/tests/test_vxace_runtime.rb --mock
          if ($LASTEXITCODE -ne 0) { throw "IA_VXACE_NATIVE_CONTRACT_FAIL" }
          ruby servidor_v2/tests/test_vxace_presentation.rb
          if ($LASTEXITCODE -ne 0) { throw "IA_VXACE_PRESENTATION_CONTRACT_FAIL" }
          python -m unittest discover -s servidor_v2/tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw "IA_VXACE_WORKER_REGRESSION" }
          cargo test --manifest-path servidor_v2/vxace-helper/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "IA_VXACE_RUST_TEST_FAIL" }
          cargo build --release --manifest-path servidor_v2/vxace-helper/Cargo.toml --bins --examples
          if ($LASTEXITCODE -ne 0) { throw "IA_VXACE_HELPER_BUILD_FAIL" }
      - name: XP lab preflight before real models
        shell: pwsh
        run: |
          ruby -c servidor_v2/cmd/servidor/xp_native/window.rb
          if ($LASTEXITCODE -ne 0) { throw "IA_RPGXP_NATIVE_WINDOW_SYNTAX" }
          ruby -c servidor_v2/cmd/servidor/xp_native/main.rb
          if ($LASTEXITCODE -ne 0) { throw "IA_RPGXP_NATIVE_MAIN_SYNTAX" }
          ruby servidor_v2/tests/test_rpgxp_runtime.rb
          if ($LASTEXITCODE -ne 0) { throw "IA_RPGXP_NATIVE_CONTRACT_FAIL" }
          ruby servidor_v2/tests/test_rpgxp_coverage.rb
          if ($LASTEXITCODE -ne 0) { throw "IA_RPGXP_COVERAGE_FAIL" }
          python servidor_v2/tests/probe_rpgxp_bridge.py
          if ($LASTEXITCODE -ne 0) { throw "IA_RPGXP_IPC_PREFLIGHT_FAIL" }
          Push-Location servidor_v2
          try {
            go test ./cmd/servidor -run TestRPGXP -count=1
            if ($LASTEXITCODE -ne 0) { throw "IA_RPGXP_INSTALL_PREFLIGHT_FAIL" }
          } finally { Pop-Location }
      - name: Verify actual native helper launch and Ruby startup before downloading OPUS
        shell: pwsh
        run: |
          python servidor_v2/tests/probe_vxace_launch.py --target servidor_v2/vxace-helper/target/release
          if ($LASTEXITCODE -ne 0) { throw "IA_VXACE_NATIVE_LAUNCH_PREFLIGHT_FAIL" }
      - name: Exigir regresiones de presentacion MV/MZ antes de preparar el EXE
        shell: pwsh
        run: |
          python -m unittest discover -s servidor_v2/tests -p test_worker.py
          if ($LASTEXITCODE -ne 0) { throw "IA_R18_WORKER_REGRESSION_FAIL" }
          node --check servidor_v2/plugin/IATraductora.js
          if ($LASTEXITCODE -ne 0) { throw "IA_PLUGIN_SYNTAX_FAIL" }
          node servidor_v2/tests/test_mv_dialogue.js
          if ($LASTEXITCODE -ne 0) { throw "IA_PLUGIN_REGRESSION_FAIL" }
          Push-Location servidor_v2
          try {
            go test ./cmd/servidor -run "TestMZCompressedNativeDetectionAndInstallation|TestMZDetectionAndInstallation|TestHalva" -count=1
            if ($LASTEXITCODE -ne 0) { throw "IA_R17_COMPRESSED_INSTALL_FAIL" }
          } finally { Pop-Location }
      - name: Validar Edge y CSP con respuestas sintéticas antes de cargar OPUS
        shell: pwsh
        run: |
          $deps=Join-Path $env:RUNNER_TEMP "ia-web-browser-deps"
          npm install --prefix $deps --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.52.0
          if ($LASTEXITCODE -ne 0) { throw "IA_WEB_BROWSER_TEST_DEPENDENCY_FAIL" }
          python servidor_v2/tests/probe_web_browser_preflight.py --playwright (Join-Path $deps "node_modules/playwright-core")
          if ($LASTEXITCODE -ne 0) { throw "IA_WEB_BROWSER_CSP_PREFLIGHT_FAIL" }
      - name: Build native Windows WebView2 player using pinned Microsoft SDK
        shell: pwsh
        run: |
          servidor_v2/tools/build_webhost.ps1 -Output (Join-Path $env:RUNNER_TEMP "ia-webhost")
          if ($LASTEXITCODE -ne 0) { throw "IA_WEB_DESKTOP_BUILD_FAIL" }
      - name: Obtain official SDK and verify published SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='0.48.4'
          $name="nwjs-sdk-v$version-win-x64.zip"
          $base="https://dl.nwjs.io/v$version"
          $archive=Join-Path $env:RUNNER_TEMP $name
          $sums=Join-Path $env:RUNNER_TEMP "NWJS-SHASUMS256.txt"
          Invoke-WebRequest "$base/SHASUMS256.txt" -OutFile $sums -TimeoutSec 120
          $pattern='^([A-Fa-f0-9]{64})\s+\*?'+[regex]::Escape($name)+'\s*$'
          $matches=@(Get-Content -LiteralPath $sums | Where-Object { $_ -match $pattern })
          if ($matches.Count -ne 1) { throw "IA_NWBIN_OFFICIAL_SHA_MISSING" }
          $want=([regex]::Match($matches[0],$pattern)).Groups[1].Value.ToLowerInvariant()
          Invoke-WebRequest "$base/$name" -OutFile $archive -TimeoutSec 360
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $want) { throw "IA_NWBIN_SDK_SHA_MISMATCH" }
          $dir=Join-Path $env:RUNNER_TEMP "r44-sdk"
          Expand-Archive -LiteralPath $archive -DestinationPath $dir
          $sdk=Join-Path $dir "nwjs-sdk-v$version-win-x64"
          if (!(Test-Path -LiteralPath (Join-Path $sdk "nw.exe")) -or !(Test-Path -LiteralPath (Join-Path $sdk "nwjc.exe"))) { throw "IA_NWBIN_SDK_INCOMPLETE" }
          "IA_R44_NWBIN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: R44 native UI preflight before model download
        shell: pwsh
        run: |
          node --check servidor_v2/tests/r44_nwbin_renderer.js
          if ($LASTEXITCODE -ne 0) { throw "IA_R44_RENDERER_SYNTAX" }
          Push-Location servidor_v2
          try {
            go test ./cmd/servidor -run '^TestR44NWBinNativeUI$' -count=1 -v -timeout=8m
            if ($LASTEXITCODE -ne 0) { throw "IA_R44_NATIVE_UI_PREFLIGHT_FAIL" }
          } finally { Pop-Location }
      - name: Bloqueo si no se dispone de origen privado cifrado
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:IA_PASSWORD) -or $env:IA_PASSWORD.Length -lt 20) {
            throw "IA_MODELOS_FIRMADOS_CIFRADOS_NO_AUTORIZADOS_HOLD"
          }
          if ([string]::IsNullOrEmpty($env:GH_TOKEN)) {
            throw "IA_CREDENCIAL_ARTIFACT_ORIGINAL_FALTANTE_HOLD"
          }
      - name: Descargar origen de modelos OPUS ya verificado - NUNCA instalar antiguo programa en la entrega
        shell: pwsh
        run: |
          $location=Join-Path $env:RUNNER_TEMP "ia-v2-old-verified-source"
          New-Item -ItemType Directory -Force -Path $location | Out-Null
          gh run download 45117163135 --repo eduardolupaca01-lgtm/public-translation-regression-lab --name SERVIDOR-RPG-MV-WIN10-V95-CIFRADO --dir $location | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "IA_CI_ORIGINAL_VERIFIED_MODELS_UNAVAILABLE" }
          $archives=@(Get-ChildItem -LiteralPath $location -Filter '*.7z' -File)
          if ($archives.Count -ne 1) { throw "IA_CI_ORIGINAL_ARCHIVE_AMBIGUOUS" }
          $sha=(Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "74848905ad3313c08f8af7781c73234338de293e3a08fc2b06fb89b7b3971c57") {
            throw "IA_CI_ORIGINAL_ARCHIVE_PIN_INVALID"
          }
          $env:IA_CIPHER=$archives[0].FullName
          $seven="C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path -LiteralPath $seven)) { $seven=(Get-Command 7z.exe -ErrorAction Stop).Source }
          $destination=Join-Path $env:RUNNER_TEMP "ia-v2-decoded-source"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          & $seven x "-p$env:IA_PASSWORD" "-o$destination" -y $archives[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "IA_MODELOS_ORIGINALES_NO_DESCIFRADOS" }
          $old=Join-Path $destination "Servidor.exe"
          if (!(Test-Path -LiteralPath $old -PathType Leaf)) { throw "IA_FUENTE_ORIGINAL_AUSENTE" }
          Write-Host "IA_MODELOS_ORIGINALES_VERIFICADOS_SOLO_COMO_FUENTE_DE_BUILD"
      - name: Extraer los pesos verificados mediante un juego MV SINTÉTICO, sin datos del jugador
        shell: pwsh
        run: |
          $old=Join-Path $env:RUNNER_TEMP "ia-v2-decoded-source\Servidor.exe"
          $game=Join-Path $env:RUNNER_TEMP "ia-v2-verified-model-source-日本語"
          $js=Join-Path $game "www\js"
          $data=Join-Path $game "www\data"
          New-Item -ItemType Directory -Force -Path (Join-Path $js "plugins"),$data | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $game 'Game.exe'),[byte[]]@(77,90,0,0))
          'var $plugins = [];' | Set-Content -LiteralPath (Join-Path $js 'plugins.js') -Encoding UTF8
          '// MV synthetic fixture - not executed' | Set-Content -LiteralPath (Join-Path $js 'rpg_core.js') -Encoding UTF8
          '// MV synthetic fixture - not executed' | Set-Content -LiteralPath (Join-Path $js 'rpg_managers.js') -Encoding UTF8
          '{}' | Set-Content -LiteralPath (Join-Path $data 'System.json') -Encoding UTF8
          $env:TX771_PORTABLE_GAME_EXE=Join-Path $game "Game.exe"
          $env:TX541_RPG_DIAGNOSTIC_FILE=Join-Path $env:RUNNER_TEMP "ia-v2-old-private-diagnostic.txt"
          $output=Join-Path $env:RUNNER_TEMP "ia-v2-old-private-output.txt"
          $errors=Join-Path $env:RUNNER_TEMP "ia-v2-old-private-errors.txt"
          $p=Start-Process -FilePath $old -ArgumentList "--rpg-onefile-portable-smoke" -Wait -PassThru -RedirectStandardOutput $output -RedirectStandardError $errors -ErrorAction Stop
          if ($null -eq $p -or $p.ExitCode -ne 0) {
            throw "IA_FUENTE_VERIFICADA_NO_EXTRAE_MODELOS_HOLD"
          }
          $engine=Join-Path $game "Tenshixgame-IA\.local\TENSHIXGAME-RPG\engine\engine"
          $owner=Join-Path $game "Tenshixgame-IA\portable-owner-v1.json"
          $worker=Join-Path $engine "TenshixgameAI.exe"
          if (!(Test-Path -LiteralPath $worker -PathType Leaf) -or !(Test-Path -LiteralPath $owner -PathType Leaf)) {
            throw "IA_MODELO_ORIGINAL_Y_PROPIEDAD_NO_VERIFICABLE"
          }
          $ownerData=Get-Content -LiteralPath $owner -Raw | ConvertFrom-Json
          $sha=(Get-FileHash -LiteralPath $worker -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ownerData.worker_sha256 -ne $sha -or $ownerData.schema -ne "tenshixgame-rpg-portable-owner-v1") {
            throw "IA_FIRMA_DEL_MODELO_ORIGINAL_INVALIDA"
          }
          if (!(Test-Path -LiteralPath (Join-Path $engine "bundle_manifest.json"))) {
            throw "IA_MODELOS_ORIGINALES_SIN_MANIFIESTO"
          }
          $dest=Join-Path $env:RUNNER_TEMP "ia-v2-models"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach($name in @("opus_ja_es","opus_en_es")) {
            Copy-Item -LiteralPath (Join-Path $engine "models\$name") -Destination (Join-Path $dest $name) -Recurse -ErrorAction Stop
            $model=Join-Path $dest "$name\model.bin"
            if (!(Test-Path $model) -or (Get-Item -LiteralPath $model).Length -lt 50000000) {
              throw "IA_MODELO_OPUS_PESO_INVALIDO"
            }
            if (!(Test-Path -LiteralPath (Join-Path $dest "$name\OPUS_LICENSE.txt"))) {
              throw "IA_LICENCIA_OPUS_FALTANTE"
            }
          }
          Write-Host "IA_DOS_MODELOS_OPUS_FIRMADOS_LISTOS_PARA_NUEVO_RUNTIME"
      - name: Congelar el NUEVO motor Python CT2 con nombre propio y sin ventanas secundarias
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0 ctranslate2==4.6.0 sentencepiece==0.2.1
          if ($LASTEXITCODE -ne 0) { throw "IA_DEPENDENCIAS_INFERENCIA_NUEVA_NO_DISPONIBLES" }
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name IATraductora --collect-all ctranslate2 --collect-all sentencepiece servidor_v2/worker/IATraductora.py
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath "dist/IATraductora.exe")) {
            throw "IA_MOTOR_PROPIO_NO_COMPILA"
          }
          Write-Host "IA_WORKER_BINARIO_NUEVO_NO_EJECUTA_GUI_ANTIGUA"
      - name: Empaquetar motor JSON independiente en modo onedir sin segundo proceso
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --contents-directory _internal --name IATraductora --distpath dist-json --workpath build-json --specpath spec-json --collect-all ctranslate2 --collect-all sentencepiece servidor_v2/worker/IATraductora.py
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath "dist-json/IATraductora/IATraductora.exe") -or !(Test-Path -LiteralPath "dist-json/IATraductora/_internal/python311.dll")) { throw "IA_MV_JSON_RUNTIME_NO_COMPILA" }
          python servidor_v2/tests/audit_pyinstaller_warnings.py build-json/IATraductora/warn-IATraductora.txt
          if ($LASTEXITCODE -ne 0) { throw "IA_MV_JSON_RUNTIME_ANALISIS_INVALIDO" }
      - name: Validate actual onedir inventory before building Servidor
        shell: pwsh
        run: |
          python -m unittest discover -s servidor_v2/tests -p test_pack_vxace_assets.py -v
          if ($LASTEXITCODE -ne 0) { throw "IA_MV_JSON_RUNTIME_PACK_TEST_FAIL" }
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'servidor_v2/tools'); from pack import json_runtime_assets; a=json_runtime_assets(Path('dist-json/IATraductora')); print('IA_MV_JSON_RUNTIME_INVENTORY_OK files=%d empty_metadata=%d' % (len(a),sum(p.stat().st_size==0 for p in a.values())))"
          if ($LASTEXITCODE -ne 0) { throw "IA_MV_JSON_RUNTIME_INVENTORY_FAIL" }
      - name: Auditar advertencias de analisis PyInstaller sin exponer rutas privadas
        shell: pwsh
        run: |
          python servidor_v2/tests/audit_pyinstaller_warnings.py build/IATraductora/warn-IATraductora.txt
          if ($LASTEXITCODE -ne 0) { throw "IA_PYINSTALLER_WARNING_REPORT_INVALID" }
      - name: Verificar que el NUEVO EXE congelado carga los dos modelos OPUS reales
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP "ia-v2-models"
          New-Item -ItemType Directory -Force -Path "dist/models" | Out-Null
          foreach($name in @("opus_ja_es","opus_en_es")){
            Copy-Item -LiteralPath (Join-Path $src $name) -Destination (Join-Path "dist/models" $name) -Recurse -ErrorAction Stop
          }
          $diagnostic=Join-Path $env:RUNNER_TEMP "ia-v2-frozen-model-preflight.json"
          python servidor_v2/tools/run_verified_worker.py --worker dist/IATraductora.exe --check-models --diagnostic-file $diagnostic --timeout-seconds 150
          if ($LASTEXITCODE -ne 0) { throw "IA_MOTOR_CONGELADO_NO_CARGA_PESOS_REALES" }
          Remove-Item "dist/models" -Recurse -Force -ErrorAction Stop
          Write-Host "IA_NUEVO_BINARIO_CT2_CON_MODELOS_REALES_PASO"

      - name: Crear un único Servidor.exe con los pesos OPUS originales y el instalador NUEVO
        shell: pwsh
        run: |
          Push-Location servidor_v2
          try {
            go test ./...
            if ($LASTEXITCODE -ne 0) { throw "IA_INSTALADOR_INDEPENDIENTE_REGRESION" }
            go build -trimpath -ldflags "-H=windowsgui" -o (Join-Path $env:RUNNER_TEMP "ia-v2-bootstrap.exe") ./cmd/servidor
            if ($LASTEXITCODE -ne 0) { throw "IA_SERVIDOR_EXE_NO_COMPILA" }
          } finally { Pop-Location }
          $out=Join-Path $env:RUNNER_TEMP "Servidor.exe"
          python servidor_v2/tools/pack.py --bootstrap (Join-Path $env:RUNNER_TEMP "ia-v2-bootstrap.exe") --worker dist/IATraductora.exe --plugin servidor_v2/plugin/IATraductora.js --models (Join-Path $env:RUNNER_TEMP "ia-v2-models") --vxace-helper servidor_v2/vxace-helper/target/release/servidor-vxace-helper.exe --vxace-plugin servidor_v2/vxace/IATraductoraVXACE.rb --web-host-dir (Join-Path $env:RUNNER_TEMP "ia-webhost") --rpgxp-launcher (Join-Path $env:RUNNER_TEMP "ia-v2-bootstrap.exe") --rpgxp-plugin servidor_v2/rpgxp/IATraductoraXP.rb --json-runtime-dir dist-json/IATraductora --out $out
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $out)) {
            throw "IA_SERVIDOR_PROPIO_PAQUETE_INVALIDO"
          }
          Write-Host "IA_SERVIDOR_UNICO_EXE_CON_MODELOS_Y_PLUGIN_PROPIOS_CREADO"
      - name: R44 - compiled original laboratory scripts, actual MV plugin, real OPUS, F10 and persistent memory
        shell: pwsh
        run: |
          node --check servidor_v2/tests/r44_nwbin_renderer.js
          if ($LASTEXITCODE -ne 0) { throw "IA_R44_RENDERER_SYNTAX" }
          $env:IA_R44_REAL_PACKAGE=Join-Path $env:RUNNER_TEMP "Servidor.exe"
          Push-Location servidor_v2
          try {
            go test ./cmd/servidor -run '^TestR44NWBinRealOPUS$' -count=1 -v -timeout=15m
            if ($LASTEXITCODE -ne 0) { throw "IA_R44_NWBIN_REAL_OPUS_ACCEPTANCE_FAIL" }
          } finally { Pop-Location }
      - name: R44 offline JSON pilot - real packaged OPUS, independent copy, native NW.js paint
        shell: pwsh
        run: |
          $env:IA_R44_REAL_PACKAGE=Join-Path $env:RUNNER_TEMP "Servidor.exe"
          Push-Location servidor_v2
          try {
            go test ./cmd/servidor -run '^TestR44JSONPilotRealOPUS$' -count=1 -v -timeout=20m
            if ($LASTEXITCODE -ne 0) { throw "IA_R44_JSON_REAL_OPUS_ACCEPTANCE_FAIL" }
          } finally { Pop-Location }
      - name: R44 direct JSON - real OPUS, original folder, native paint, exact restore and cache
        shell: pwsh
        run: |
          $env:IA_R44_REAL_PACKAGE=Join-Path $env:RUNNER_TEMP "Servidor.exe"
          Push-Location servidor_v2
          try {
            go test ./cmd/servidor -run '^TestR44JSONDirectRealOPUS$' -count=1 -v -timeout=24m
            if ($LASTEXITCODE -ne 0) { throw "IA_R44_JSON_DIRECT_REAL_ACCEPTANCE_FAIL" }
          } finally { Pop-Location }
      - name: XP lab - actual packaged installer, installed launcher, OPUS and restore
        shell: pwsh
        run: |
          python servidor_v2/tests/probe_rpgxp_real.py --servidor (Join-Path $env:RUNNER_TEMP "Servidor.exe")
          if ($LASTEXITCODE -ne 0) { throw "IA_RPGXP_REAL_OPUS_ACCEPTANCE_FAIL" }
      - name: VX Ace - installed script, real OPUS IPC, cache and exact restoration
        shell: pwsh
        run: |
          python servidor_v2/tests/test_vxace_real_worker.py --servidor (Join-Path $env:RUNNER_TEMP "Servidor.exe") --fixture servidor_v2/vxace-helper/target/release/examples/vxace_fixture.exe
          if ($LASTEXITCODE -ne 0) { throw "IA_VXACE_REAL_OPUS_ACCEPTANCE_FAIL" }
      - name: Instalar desde Servidor.exe propio en MV sintético y verificar nuevo puente con traducción neuronal REAL
        shell: pwsh
        run: |
          $game=Join-Path $env:RUNNER_TEMP "ia-v2-acceptance-juego-日本語"
          $js=Join-Path $game "www\js"
          $data=Join-Path $game "www\data"
          New-Item -ItemType Directory -Force -Path (Join-Path $js "plugins"),$data | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $game "Game.exe"),[byte[]]@(77,90,0,0))
          'var $plugins = [];' | Set-Content -LiteralPath (Join-Path $js 'plugins.js') -Encoding UTF8
          '// MV synthetic fixture' | Set-Content -LiteralPath (Join-Path $js 'rpg_core.js') -Encoding UTF8
          '{}' | Set-Content -LiteralPath (Join-Path $data 'System.json') -Encoding UTF8
          $exe=Join-Path $env:RUNNER_TEMP "Servidor.exe"
          $output=Join-Path $env:RUNNER_TEMP "ia-v2-new-private-output.txt"
          $errors=Join-Path $env:RUNNER_TEMP "ia-v2-new-private-errors.txt"
          $arg='--game "'+(Join-Path $game "Game.exe")+'"'
          $p=Start-Process -FilePath $exe -ArgumentList $arg -Wait -PassThru -RedirectStandardOutput $output -RedirectStandardError $errors -ErrorAction Stop
          if ($null -eq $p -or $p.ExitCode -ne 0) {
            throw "IA_SERVIDOR_UNICO_NO_INSTALO_MV"
          }
          $worker=Join-Path $game "IA Traductora\.local\Rpg\engine\IATraductora.exe"
          $plugin=Join-Path $js "plugins\IATraductora.js"
          if (!(Test-Path -LiteralPath $worker -PathType Leaf) -or !(Test-Path -LiteralPath $plugin -PathType Leaf)) {
            throw "IA_COMPONENTES_PROPIOS_NO_INSTALADOS"
          }
          if (Test-Path -LiteralPath (Join-Path $game "Tenshixgame-IA")) {
            throw "IA_IDENTIDAD_FISICA_ANTIGUA_EN_NUEVA_INSTALACION"
          }
          $list=Get-Content -LiteralPath (Join-Path $js "plugins.js") -Raw
          if (-not $list.Contains('"name":"IATraductora"')) {
            throw "IA_PLUGIN_NO_REGISTRADO"
          }
