name: TENSHIXGAME VX Ace RGSS3 adapter

on:
  push:
    branches:
      - feature/rpg-maker-vx-ace-rgss3-20261126
    paths:
      - "servidor_v2/rgss3/**"
      - ".github/workflows/rgss3-vxace-adapter.yml"
  pull_request:
    branches:
      - feature/servidor-v2-rpg-mz-20261124
    paths:
      - "servidor_v2/rgss3/**"
      - ".github/workflows/rgss3-vxace-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    name: RGSS3 read-only archive and Marshal inventory
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test archive paths, RGSS3A round-trip and adapter contracts
        run: cargo test --manifest-path servidor_v2/rgss3/Cargo.toml --all-targets
      - name: Build Windows x64 probe
        if: runner.os == 'Windows'
        run: cargo build --manifest-path servidor_v2/rgss3/Cargo.toml --release
      - name: Upload read-only diagnostic helper
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TENSHIXGAME-RGSS3-PROBE-WINDOWS-X64
          path: servidor_v2/rgss3/target/release/tenshixgame-rgss3-probe.exe
          if-no-files-found: error
          retention-days: 7
