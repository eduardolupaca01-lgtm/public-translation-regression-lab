name: Qwen3-8B thinking RPG twelve-dialogue exploratory research

on:
  push:
    branches:
      - experiment/qwen3-ja-es-candidate-20261120
    paths:
      - ".github/workflows/stage4-rpg-neural-research.yml"
      - "tools/stage4_rpg_neural_research.py"
      - "tests/test_stage4_rpg_neural_research.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4-rpg-neural-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: RPG control codes and multi-clause source-only neural stress research
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HOME: /tmp/qwen8b-stage4-rpg-hf
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      STAGE4_RPG_WORKSPACE: /tmp/qwen8b-stage4-rpg-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard publication and run independent offline tests
        run: |
          python tools/publication_guard.py
          python -m compileall -q translation_lab tests tools
          python -m unittest discover -s tests -v

      - name: Freeze Japanese-only RPG stress sources
        run: |
          python -m tools.stage4_rpg_stress_cases \
            --out "$RUNNER_TEMP/rpg-source-manifest.json"

      - name: Download pinned llama.cpp CPU server
        run: |
          mkdir -p "$RUNNER_TEMP/llama"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12584/llama-b12584-bin-ubuntu-x64.tar.gz" \
            --output "$RUNNER_TEMP/llama-b12584.tar.gz"
          tar -xzf "$RUNNER_TEMP/llama-b12584.tar.gz" -C "$RUNNER_TEMP/llama"
          LLAMA_SERVER="$(find "$RUNNER_TEMP/llama" -type f -name llama-server -print -quit)"
          test -n "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$LLAMA_SERVER"):$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          "$LLAMA_SERVER" --version

      - name: Install pinned Hugging Face download client
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            huggingface_hub==0.36.0

      - name: Translate twelve separate RPG sources with uniform pinned model
        run: |
          python -m tools.stage4_rpg_neural_research translate \
            --llama-server "$LLAMA_SERVER" \
            --workspace "$STAGE4_RPG_WORKSPACE"

      - name: Verify SQLite and original RPG structure after cold-process restart
        if: always()
        run: |
          if [ -f "$STAGE4_RPG_WORKSPACE/rpg-neural-report.json" ]; then
            python -m tools.stage4_rpg_neural_research verify \
              --workspace "$STAGE4_RPG_WORKSPACE"
          else
            echo "RPG_NEURAL_REPORT_MISSING"
          fi

      - name: Preserve raw Japanese and Spanish, review and restart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-rpg-twelve-research-receipts
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/qwen8b-stage4-rpg-research/rpg-neural-report.json
            /tmp/qwen8b-stage4-rpg-research/rpg-source-manifest.json
            /tmp/qwen8b-stage4-rpg-research/rpg-cold-restart-proof.json
            /tmp/qwen8b-stage4-rpg-research/rpg-review-queue.json
            /tmp/qwen8b-stage4-rpg-research/llama-server.log
            /tmp/qwen8b-stage4-rpg-research/cache/translation-cache.sqlite3
