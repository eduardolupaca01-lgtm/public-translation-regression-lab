name: Public research-only NLLB Japanese-to-Spanish benchmark

on:
  push:
    paths:
      - ".github/workflows/nllb-research-acceptance.yml"
      - "tools/nllb_research_acceptance.py"
      - "tools/direct_marian_acceptance.py"
      - "tools/neural_acceptance.py"
      - "translation_lab/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-nllb-research-ja-es-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-nllb:
    name: Research-only NLLB JA-ES with SQLite restart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: /tmp/public-nllb-600m-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "90"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      CI_WORKSPACE: /tmp/nllb-research-ja-es
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject accidental private assets
        run: python tools/publication_guard.py
      - name: Run strict structural and quality-cache tests
        run: python -m unittest discover -s tests -v
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Install pinned open inference runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            transformers==4.57.1 sentencepiece==0.2.1
      - name: Evaluate real public NLLB research model on 12 synthetic examples
        run: python -m tools.nllb_research_acceptance translate --workspace "$CI_WORKSPACE"
      - name: Verify approved translations persist without model import
        if: always()
        run: python -m tools.nllb_research_acceptance verify --workspace "$CI_WORKSPACE"
      - name: Preserve synthetic-only acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-nllb-research-receipts
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/nllb-research-ja-es/neural-report.json
            /tmp/nllb-research-ja-es/restart-proof.json
            /tmp/nllb-research-ja-es/review-queue.json
            /tmp/nllb-research-ja-es/cache/translation-cache.sqlite3
