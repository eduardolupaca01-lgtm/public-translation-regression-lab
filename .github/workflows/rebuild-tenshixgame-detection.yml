name: TENSHIXGAME NEXT - motor y versión (inspección de solo lectura)

on:
  push:
    branches:
      - rebuild/tenshixgame-unificado-deteccion-20261122
    paths:
      - tenshixgame-next/**
      - .github/workflows/rebuild-tenshixgame-detection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detector:
    name: Pruebas de seguridad y detección - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tenshixgame-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tenshixgame-next/go.mod
      - name: Pruebas de las generaciones y rechazo de escrituras
        run: go test ./... -count=1 -v
      - name: Comprobar API y código
        run: go vet ./...
  windows-exe:
    name: EXE independiente del detector (SIN instalador IA)
    needs: [detector]
    runs-on: windows-2022
    defaults:
      run:
        working-directory: tenshixgame-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tenshixgame-next/go.mod
      - name: Compilar consola Windows sin dependencias
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/TENSHIXGAME-Detector-CLI.exe ./cmd/tenshixgame
          if ($LASTEXITCODE -ne 0) { throw "DETECTOR_BUILD_FAILED" }
          go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui" -o dist/TENSHIXGAME-Detector-Visual.exe ./cmd/tenshixgame-gui
          if ($LASTEXITCODE -ne 0) { throw "DETECTOR_VISUAL_BUILD_FAILED" }
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw "DETECTOR_WINDOWS_TESTS_FAILED" }
          Get-FileHash -Algorithm SHA256 dist/TENSHIXGAME-Detector-CLI.exe | Select-Object -ExpandProperty Hash
      - uses: actions/upload-artifact@v4
        with:
          name: TENSHIXGAME-NEXT-Deteccion-EXE-PRUEBA
          path: tenshixgame-next/dist/*.exe
          retention-days: 14
          if-no-files-found: error
