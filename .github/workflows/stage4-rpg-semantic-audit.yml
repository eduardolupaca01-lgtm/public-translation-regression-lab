name: Stage4 independent RPG source-faithfulness audit

on:
  push:
    branches:
      - experiment/qwen3-ja-es-candidate-20261120
    paths:
      - ".github/workflows/stage4-rpg-semantic-audit.yml"
      - "tools/stage4_rpg_semantic_audit.py"
      - "tests/test_stage4_rpg_semantic_audit.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage4-rpg-semantic-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify original RPG inference, score role fidelity and retain findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORIGINAL_RUN_ID: "44908983065"
      ORIGINAL_COMMIT: "4de80730b78b28cf89ec694437d2c79ff75f3ce3"
      EVIDENCE_DIR: /tmp/rpg-original-evidence
      AUDIT_OUTPUT: /tmp/stage4-rpg-source-audit.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Public safety and offline tests
        run: |
          python tools/publication_guard.py
          python -m compileall -q translation_lab tools tests
          python -m unittest discover -s tests -v

      - name: Verify successful original model run and immutable SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN_ID" \
            --output "$RUNNER_TEMP/rpg-original-run.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"rpg-original-run.json").read_text())
          assert r["status"]=="completed" and r["conclusion"]=="success", "ORIGINAL_RPG_NOT_PASSED"
          assert r["head_sha"]==os.environ["ORIGINAL_COMMIT"], "ORIGINAL_RPG_COMMIT_CHANGED"
          assert r["head_branch"]=="experiment/qwen3-ja-es-candidate-20261120", "ORIGINAL_BRANCH_CHANGED"
          assert r["repository"]["full_name"]==os.environ["GITHUB_REPOSITORY"], "ORIGINAL_REPO_CHANGED"
          print("RPG_ORIGINAL_PROVENANCE_VERIFIED",r["id"],r["head_sha"])
          PY

      - name: Download original twelve model outputs and restart receipts
        uses: actions/download-artifact@v4
        with:
          name: stage4-rpg-twelve-research-receipts
          run-id: 44908983065
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/rpg-original-evidence

      - name: Check independent source-aware semantic fidelity
        run: |
          REPORT="$(find "$EVIDENCE_DIR" -name rpg-neural-report.json -type f -print -quit)"
          RESTART="$(find "$EVIDENCE_DIR" -name rpg-cold-restart-proof.json -type f -print -quit)"
          SOURCES="$(find "$EVIDENCE_DIR" -name rpg-source-manifest.json -type f -print -quit)"
          test -n "$REPORT" && test -n "$RESTART" && test -n "$SOURCES"
          python -m tools.stage4_rpg_semantic_audit \
            --report "$REPORT" --proof "$RESTART" \
            --manifest "$SOURCES" --out "$AUDIT_OUTPUT"

      - name: Retain original-evidence-linked audit regardless of score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-original-rpg-semantic-audit
          retention-days: 30
          if-no-files-found: warn
          path: /tmp/stage4-rpg-source-audit.json
