name: Public permissive-license Japanese dialogue holdout comparison

on:
  push:
    paths:
      - ".github/workflows/permissive-holdout.yml"
      - "tools/permissive_holdout.py"
      - "tools/unseen_holdout.py"
      - "tools/direct_marian_acceptance.py"
      - "tools/m2m_acceptance.py"
      - "tools/neural_acceptance.py"
      - "tests/test_permissive_holdout.py"
      - "tests/test_unseen_holdout.py"
      - "tests/test_review_queue.py"
      - "tests/test_review_queue_integration.py"
      - "translation_lab/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-permissive-holdout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensed-holdout:
    name: Raw inference with ${{ matrix.backend }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        backend: [marian, m2m100]
    env:
      HF_HOME: /tmp/public-${{ matrix.backend }}-holdout-model-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "90"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HOLDOUT_WORKSPACE: /tmp/public-${{ matrix.backend }}-holdout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject private assets and credentials
        run: python tools/publication_guard.py
      - name: Run complete offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Install pinned public model inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            transformers==4.57.1 sentencepiece==0.2.1 sacremoses==0.1.1
      - name: Evaluate the same ten fixed cases without model-specific repairs
        run: python -m tools.permissive_holdout translate --backend "${{ matrix.backend }}" --workspace "$HOLDOUT_WORKSPACE"
      - name: Verify cache replay in a fresh process without model weights
        if: always()
        run: python -m tools.permissive_holdout verify --backend "${{ matrix.backend }}" --workspace "$HOLDOUT_WORKSPACE"
      - name: Preserve model comparison report and restart proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-${{ matrix.backend }}-holdout-receipts
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/public-${{ matrix.backend }}-holdout/holdout-report.json
            /tmp/public-${{ matrix.backend }}-holdout/holdout-restart-proof.json
            /tmp/public-${{ matrix.backend }}-holdout/review-queue.json
            /tmp/public-${{ matrix.backend }}-holdout/cache/translation-cache.sqlite3
