name: Public M2M100 Japanese-to-Spanish neural acceptance

on:
  push:
    paths:
      - ".github/workflows/m2m-neural-acceptance.yml"
      - "tools/m2m_acceptance.py"
      - "tools/direct_marian_acceptance.py"
      - "tools/neural_acceptance.py"
      - "translation_lab/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-m2m-neural-ja-es-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-m2m:
    name: MIT M2M100 JA-ES + SQLite restart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: /tmp/public-m2m100-hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      CI_WORKSPACE: /tmp/m2m100-neural-ja-es
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject private artifacts from public repo
        run: python tools/publication_guard.py
      - name: Run strict structural and role fidelity tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned PyTorch CPU runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Install pinned M2M inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            transformers==4.57.1 sentencepiece==0.2.1
      - name: Run real MIT-licensed public Japanese-to-Spanish M2M100 inference
        run: python -m tools.m2m_acceptance translate --workspace "$CI_WORKSPACE"
      - name: Verify SQLite replay in a new process without model weights
        if: always()
        run: python -m tools.m2m_acceptance verify --workspace "$CI_WORKSPACE"
